<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spin Wheel - Roda Keberuntungan Interaktif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Efek Confetti Kemenangan -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-3 select-none">

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-3 gap-4 bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-5">
        
        <!-- Panel Kontrol Input Nama (Kiri) -->
        <div class="flex flex-col gap-4 bg-slate-950/70 p-4 rounded-2xl border border-slate-800">
            <div>
                <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-rose-400 to-indigo-400">
                    3D LUCKY WHEEL
                </h1>
                <p class="text-xs text-slate-400">Masukkan daftar nama siswa atau opsi undian.</p>
            </div>

            <div class="flex-1 flex flex-col">
                <label class="text-xs font-semibold text-slate-300 mb-1.5 flex justify-between">
                    <span>Daftar Peserta (1 baris / koma):</span>
                    <span id="name-count" class="text-amber-400">8 Nama</span>
                </label>
                <textarea id="names-input" rows="8" class="w-full flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500 font-mono resize-none leading-relaxed">Ahmad
Budi Santoso
Citra Lestari
Doni Pratama
Eka Wijaya
Fajar Hidayat
Gita Permata
Hendra Saputra</textarea>
            </div>

            <div class="flex gap-2">
                <button id="btn-update" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-xl font-semibold text-xs transition">
                    ðŸ”„ Perbarui Roda
                </button>
                <button id="btn-shuffle" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-xl font-semibold text-xs transition">
                    ðŸ”€ Acak
                </button>
            </div>

            <!-- Tombol Spin Utama -->
            <button id="btn-spin" class="w-full py-4 bg-gradient-to-r from-amber-500 via-rose-500 to-indigo-500 hover:from-amber-400 hover:to-indigo-400 text-white font-extrabold text-lg rounded-2xl shadow-xl shadow-rose-500/20 active:scale-95 transition">
                PUTAR RODA SEKARANG!
            </button>
        </div>

        <!-- Wadah Roda 3D Three.js (Tengah - Kanan) -->
        <div class="lg:col-span-2 relative min-h-[480px] w-full bg-radial from-slate-900 to-slate-950 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
            
            <!-- Canvas 3D Three.js -->
            <div id="canvas-3d" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing"></div>

            <!-- Jarum Penunjuk Emas Atas (Pointer) -->
            <div class="absolute top-2 left-1/2 -translate-x-1/2 z-20 pointer-events-none drop-shadow-[0_8px_15px_rgba(245,158,11,0.6)]">
                <svg width="44" height="48" viewBox="0 0 44 48" fill="none">
                    <polygon points="22,46 4,6 40,6" fill="url(#gold-gradient)" stroke="#ffffff" stroke-width="2" />
                    <circle cx="22" cy="14" r="5" fill="#fef08a" />
                    <defs>
                        <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f59e0b" />
                            <stop offset="50%" stop-color="#fbbf24" />
                            <stop offset="100%" stop-color="#b45309" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <!-- Modal Pengumuman Pemenang -->
            <div id="winner-modal" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-6 z-30 opacity-0 pointer-events-none transition-all duration-500 scale-90">
                <div class="text-amber-400 font-bold uppercase tracking-widest text-xs mb-2">ðŸŽ‰ Pemenang Terpilih! ðŸŽ‰</div>
                <h2 id="winner-name" class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-rose-300 to-white text-center mb-6 drop-shadow-md">
                    -
                </h2>
                <button id="btn-close-winner" class="px-8 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow-lg transition">
                    Tutup & Main Lagi
                </button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-3d');
        const namesInput = document.getElementById('names-input');
        const nameCountEl = document.getElementById('name-count');
        const btnSpin = document.getElementById('btn-spin');
        const btnUpdate = document.getElementById('btn-update');
        const btnShuffle = document.getElementById('btn-shuffle');
        const winnerModal = document.getElementById('winner-modal');
        const winnerNameEl = document.getElementById('winner-name');
        const btnCloseWinner = document.getElementById('btn-close-winner');

        // Palet Warna Sektor Roda
        const sectorColors = [
            '#e11d48', '#2563eb', '#16a34a', '#d97706',
            '#7c3aed', '#0891b2', '#db2777', '#4f46e5',
            '#059669', '#ea580c', '#6d28d9', '#0284c7'
        ];

        let participants = [];

        // Web Audio Synthesizer (SFX Detak Roda & Terompet)
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTickSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.04);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.04);
            } catch(e) {}
        }

        function playVictorySound() {
            try {
                const ctx = getAudioContext();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const startTime = ctx.currentTime + (idx * 0.1);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.5);
                });
            } catch(e) {}
        }

        // ==============================================================
        // SETUP THREE.JS 3D SCENE
        // ==============================================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Pencahayaan Realistis
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xfffbeb, 1.8);
        spotLight.position.set(5, 12, 14);
        spotLight.angle = Math.PI / 4;
        scene.add(spotLight);

        const rimLight = new THREE.PointLight(0x60a5fa, 0.8);
        rimLight.position.set(-8, -6, 6);
        scene.add(rimLight);

        // Grup Objek Roda 3D
        const wheelGroup = new THREE.Group();
        scene.add(wheelGroup);

        // Frame Pinggir Emas (Torus / Donut Lingkar Luar)
        const outerRimGeo = new THREE.TorusGeometry(5.08, 0.28, 24, 80);
        const goldMaterial = new THREE.MeshStandardMaterial({
            color: 0xf59e0b,
            metalness: 0.85,
            roughness: 0.25
        });
        const outerRim = new THREE.Mesh(outerRimGeo, goldMaterial);
        wheelGroup.add(outerRim);

        // Penutup Poros Tengah (Center Hub Emas)
        const hubGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.6, 32);
        hubGeo.rotateX(Math.PI / 2);
        const centerHub = new THREE.Mesh(hubGeo, goldMaterial);
        centerHub.position.z = 0.2;
        wheelGroup.add(centerHub);

        let wheelMesh = null;

        // Render Tekstur Roda 2D ke Permukaan Tabung 3D
        function buildWheelTexture(names) {
            const size = 2048;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const center = size / 2;
            const radius = size / 2 - 20;
            const count = names.length;
            const arc = (Math.PI * 2) / count;

            for (let i = 0; i < count; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + arc);
                ctx.closePath();
                ctx.fillStyle = sectorColors[i % sectorColors.length];
                ctx.fill();

                ctx.lineWidth = 4;
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.stroke();

                // Gambar Teks Nama Menghadap ke Luar
                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = `bold ${Math.max(26, Math.min(64, Math.floor(650 / count)))}px sans-serif`;
                ctx.shadowColor = "rgba(0,0,0,0.6)";
                ctx.shadowBlur = 8;
                
                let text = names[i];
                if (text.length > 18) text = text.substring(0, 16) + '..';
                ctx.fillText(text, radius - 60, 12);
                ctx.restore();
            }

            return new THREE.CanvasTexture(canvas);
        }

        function createWheel3D() {
            if (wheelMesh) wheelGroup.remove(wheelMesh);

            const texture = buildWheelTexture(participants);
            const wheelGeo = new THREE.CylinderGeometry(5, 5, 0.35, Math.max(32, participants.length * 4));
            wheelGeo.rotateX(Math.PI / 2);

            // Material Tabung (Depan Bertekstur, Pinggir Gelap Logam)
            const sideMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.3 });
            const faceMat = new THREE.MeshBasicMaterial({ map: texture });
            
            wheelMesh = new THREE.Mesh(wheelGeo, [sideMat, faceMat, faceMat]);
            wheelGroup.add(wheelMesh);
        }

        function parseParticipants() {
            const raw = namesInput.value;
            participants = raw.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            if (participants.length === 0) participants = ["Peserta 1", "Peserta 2"];
            nameCountEl.innerText = `${participants.length} Nama`;
            createWheel3D();
        }

        // ==============================================================
        // LOGIKA FISIKA PUTARAN & PENENTUAN PEMENANG
        // ==============================================================
        let isSpinning = false;
        let currentRotation = 0;
        let targetRotation = 0;
        let spinVelocity = 0;
        let lastTickAngle = 0;

        function startSpin() {
            if (isSpinning || participants.length < 2) return;
            getAudioContext();
            isSpinning = true;
            btnSpin.disabled = true;
            btnSpin.classList.add('opacity-50', 'cursor-not-allowed');

            // Putaran acak: minimal 5 putaran penuh (5 * 2PI) + sudut acak
            const minSpins = 6;
            const extraRadian = Math.random() * Math.PI * 2;
            const totalTravel = (minSpins * Math.PI * 2) + extraRadian;

            targetRotation = currentRotation + totalTravel;
            spinVelocity = 0.28; // Kecepatan awal
            lastTickAngle = currentRotation;
        }

        function determineWinner() {
            const total = participants.length;
            const arc = (Math.PI * 2) / total;

            // Normalisasi rotasi ke rentang 0 s.d 2*PI
            const normalized = (currentRotation % (Math.PI * 2) + (Math.PI * 2)) % (Math.PI * 2);

            // Jarum berada di posisi Jam 12 (sudut 3*PI/2 atau -PI/2)
            // Hitung sektor yang tepat berada di bawah jarum:
            const pointerAngle = (Math.PI * 1.5 - normalized + (Math.PI * 2)) % (Math.PI * 2);
            const winnerIdx = Math.floor(pointerAngle / arc) % total;

            const winner = participants[winnerIdx];
            showWinnerModal(winner);
        }

        function showWinnerModal(name) {
            winnerNameEl.innerText = name;
            winnerModal.classList.remove('opacity-0', 'pointer-events-none', 'scale-90');
            winnerModal.classList.add('opacity-100', 'scale-100');
            playVictorySound();

            // Efek Confetti Bintang Emas
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        btnCloseWinner.addEventListener('click', () => {
            winnerModal.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
            winnerModal.classList.remove('opacity-100', 'scale-100');
            btnSpin.disabled = false;
            btnSpin.classList.remove('opacity-50', 'cursor-not-allowed');
        });

        btnSpin.addEventListener('click', startSpin);

        btnUpdate.addEventListener('click', () => {
            parseParticipants();
        });

        btnShuffle.addEventListener('click', () => {
            participants.sort(() => Math.random() - 0.5);
            namesInput.value = participants.join('\n');
            parseParticipants();
        });

        // Loop Animasi Utamaa
        function animate() {
            requestAnimationFrame(animate);

            if (isSpinning) {
                const distanceRemaining = targetRotation - currentRotation;

                if (distanceRemaining > 0.005) {
                    // Deselerasi Halus (Ease-Out)
                    const speed = Math.max(0.002, distanceRemaining * 0.045);
                    currentRotation += speed;
                    wheelGroup.rotation.z = currentRotation;

                    // Memicu Bunyi Ticking Setiap Melewati Sektor
                    const arc = (Math.PI * 2) / participants.length;
                    if (currentRotation - lastTickAngle >= arc) {
                        playTickSound();
                        lastTickAngle = currentRotation;
                    }
                } else {
                    currentRotation = targetRotation;
                    wheelGroup.rotation.z = currentRotation;
                    isSpinning = false;
                    determineWinner();
                }
            } else {
                // Goyangan Halus (Idle Wobble) di Ruang 3D
                wheelGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.08;
                wheelGroup.rotation.x = Math.cos(Date.now() * 0.001) * 0.05;
            }

            renderer.render(scene, camera);
        }

        // Responsif Resize Layar
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // Inisialisasi awal
        parseParticipants();
        animate();
    </script>
</body>
</html>
